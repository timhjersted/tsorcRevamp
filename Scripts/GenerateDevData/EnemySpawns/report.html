<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>Enemy Spawns</h1>
      <span class="sub" id="summary"></span>
    </div>
    <div class="controls">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="seg" id="stages" aria-label="World stage"></div>
      <input type="search" id="search" placeholder="Search enemies, biomes, conditions…" aria-label="Search">
      <button class="iconbtn" id="theme" title="Switch light / dark">◐</button>
    </div>
  </div>
</header>
<main class="wrap">
  <section class="view" id="view-biomes"></section>
  <section class="view" id="view-enemies" hidden></section>
  <section class="view" id="view-zones" hidden></section>
  <section class="view" id="view-lists" hidden></section>
  <section class="view" id="view-glossary" hidden></section>
  <section class="view" id="view-vanilla" hidden></section>
</main>
<script>
const DATA = /*__SPAWN_DATA__*/null;

// Chip colours: one hue per kind of test (zone, depth, time...). Saturation 0 for the plain bookkeeping tests.
const HUES = {
  zone: [145], depth: [215], time: [42], weather: [195], water: [188], town: [0, '0%'], invasion: [0, '0%'],
  region: [280], mode: [330], progress: [22], downed: [22], slain: [22], terrain: [32], wall: [32], spawntile: [32],
  alive: [355], composite: [245], place: [170], other: [0, '0%'],
};
const TABS = [
  ['biomes', 'By biome'], ['enemies', 'By enemy'], ['zones', 'Exclusive zones'],
  ['lists', 'Other lists'], ['glossary', 'Glossary'], ['vanilla', 'Vanilla pool edits'],
];
const STAGE_SHORT = ['PHM', 'HM', 'SHM'];
const glossaryByKey = new Map(DATA.glossary.map(entry => [entry.key, entry]));

const state = { tab: 'biomes', stage: 0, query: '', onlyStage: false };

const esc = text => String(text ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

// Weights are relative to vanilla's own pick (weight 1): show small ones with enough digits to tell them apart.
function fmt(weight) {
  if (!weight) {
    return '–';
  }
  if (weight >= 0.1) {
    return String(+weight.toFixed(3));
  }
  return String(+weight.toPrecision(3));
}

function soloShare(weight) {
  return (weight / (1 + weight) * 100).toFixed(weight < 0.01 ? 2 : 1) + '% of spawn attempts if it were the only mod enemy here';
}

// Square-root scale so a 0.002 weight still shows a sliver next to a 0.5. Spawn weights fill the bar at 1 (vanilla's own
// pick) rather than at the largest weight, so one weight-10 room line does not flatten everything else.
const FULL_BAR = 1;
function bar(weight, max = FULL_BAR) {
  const width = max > 0 ? Math.min(1, Math.sqrt(weight / max)) * 100 : 0;
  return `<div class="bar" title="${esc(soloShare(weight))}"><i style="width:${width.toFixed(1)}%"></i></div>`;
}

function chipStyle(cat) {
  const hue = HUES[cat] || HUES.other;
  return `--h:${hue[0]};` + (hue[1] ? `--s:${hue[1]};` : '');
}

function tooltip(key, args) {
  const entry = glossaryByKey.get(key);
  const parts = [key + (args ? `(${args})` : '')];
  if (entry && entry.doc) {
    parts.push(entry.doc);
  }
  if (entry && entry.kind === 'composite') {
    parts.push('= ' + entry.code);
  }
  return parts.join('\n');
}

// Renders a condition tree: atoms as coloured chips, "or" groups in a dashed box, negations outlined with a NOT tag.
function cond(node, negated = false) {
  if (node.t === 'atom') {
    return `<span class="chip${negated ? ' neg' : ''}" style="${chipStyle(node.cat)}" title="${esc(tooltip(node.key, node.args))}">${esc(node.label)}</span>`;
  }
  if (node.t === 'not') {
    if (node.c.t === 'atom') {
      return cond(node.c, !negated);
    }
    return `<span class="group neg">${cond(node.c)}</span>`;
  }
  if (node.t === 'or') {
    return `<span class="group">${node.c.map(child => cond(child)).join('<span class="or">or</span>')}</span>`;
  }
  return node.c.map(child => cond(child)).join('');
}

function condHtml(node) {
  return `<div class="chips">${cond(node)}</div>`;
}

function flags(rule) {
  const out = [];
  if (rule.max) {
    out.push(`<span class="badge" title="Skipped once this many are alive">max ${rule.max}</span>`);
  }
  if (rule.stop) {
    out.push('<span class="badge" title="When this line applies it decides the weight; later lines of this enemy are not looked at">stop</span>');
  }
  if (rule.boost === 'night') {
    out.push('<span class="badge gray" title="Written by SpawnNightBoosted: the base line ×2 at night">night ×2</span>');
  }
  if (rule.boost === 'bloodMoon') {
    out.push('<span class="badge gray" title="Written by SpawnNightBoosted: the base line ×4 in a blood moon">blood moon ×4</span>');
  }
  if (rule.comment) {
    out.push(`<span class="badge gray" title="Comment on the registry line">${esc(rule.comment)}</span>`);
  }
  return out.join(' ');
}

function enemyText(enemy) {
  return [enemy.display, enemy.name, enemy.notes.join(' '), ...enemy.rules.map(rule => rule.text + ' ' + rule.biomes.join(' ') + ' ' + rule.comment)].join(' ').toLowerCase();
}

function matches(text) {
  return !state.query || text.toLowerCase().includes(state.query);
}

function link(enemy) {
  return `<a href="#enemy-${esc(enemy.name)}" data-enemy="${esc(enemy.name)}">${esc(enemy.display)}</a>`;
}

function renderBiomes() {
  const stage = state.stage;
  const buckets = new Map(DATA.biomes.map(biome => [biome, new Map()]));

  // Each enemy appears once per biome, at its best weight there; the expanded row lists the lines that put it there.
  for (const enemy of DATA.enemies) {
    for (const rule of enemy.rules) {
      if (!rule.w[stage]) {
        continue;
      }
      for (const biome of rule.biomes) {
        const bucket = buckets.get(biome);
        if (!bucket.has(enemy.name)) {
          bucket.set(enemy.name, { enemy, best: 0, rules: [] });
        }
        const entry = bucket.get(enemy.name);
        entry.best = Math.max(entry.best, rule.w[stage]);
        entry.rules.push(rule);
      }
    }
  }

  const cards = [];
  for (const [biome, bucket] of buckets) {
    const biomeHit = matches(biome);
    const entries = [...bucket.values()]
      .filter(entry => biomeHit || matches(enemyText(entry.enemy)))
      .sort((a, b) => b.best - a.best);
    const zones = DATA.zones.filter(zone => zone.biomes.includes(biome));
    if (!entries.length && !(zones.length && biomeHit)) {
      continue;
    }

    const banner = zones.map(zone => `<div class="zonebanner"><b>Exclusive zone</b> — only ${zone.pool.map(member => esc(member.display)).join(', ') || 'nothing'} spawn${zone.pool.length === 1 ? 's' : ''} where ${'<span class="chips" style="display:inline-flex">' + cond(zone.cond) + '</span>'}</div>`).join('');
    const rows = entries.map(entry => `
      <details class="row">
        <summary><span class="name">${link(entry.enemy)}</span>${bar(entry.best)}<span class="w">${fmt(entry.best)}</span></summary>
        <div class="detail">${entry.rules.map(rule => `<div class="mini"><span class="w">${fmt(rule.w[stage])}</span><div>${condHtml(rule.cond)}${flags(rule) ? '<div style="margin-top:3px">' + flags(rule) + '</div>' : ''}</div></div>`).join('')}</div>
      </details>`).join('');
    cards.push(`<div class="card"><h2>${esc(biome)} <span class="count">${entries.length} enem${entries.length === 1 ? 'y' : 'ies'}</span></h2>${banner}<div class="rows">${rows}</div></div>`);
  }

  document.getElementById('view-biomes').innerHTML = `
    <p class="intro">Every registry enemy that can spawn in <b>${esc(DATA.stages[stage])}</b>, grouped by the biome its condition names (a line naming two biomes appears in both; lines naming none are under <i>Any biome</i>). Weights are relative to vanilla's own pick (weight 1); a full bar means at least as likely as vanilla's pick, on a square-root scale so small weights still show. Click a row for the exact lines, or a name for the enemy's full card.</p>
    ${legend()}
    ${cards.length ? `<div class="grid">${cards.join('')}</div>` : '<div class="empty">Nothing matches.</div>'}`;
}

function legend() {
  const kinds = [['zone', 'Biome'], ['depth', 'Depth'], ['time', 'Time'], ['water', 'Water'], ['region', 'Map region'], ['place', 'Map location'], ['composite', 'Shared rule set'], ['progress', 'Progress'], ['terrain', 'Terrain / wall'], ['town', 'Town / invasion']];
  return `<div class="legend">Chip colours:${kinds.map(([cat, label]) => `<span class="chip" style="${chipStyle(cat)};cursor:default">${label}</span>`).join('')}<span class="chip neg" style="${chipStyle('zone')};cursor:default">outlined</span> = must NOT hold. Hover a chip for its definition.</div>`;
}

function renderEnemies() {
  const stage = state.stage;
  const list = DATA.enemies.filter(enemy => matches(enemyText(enemy)) && (!state.onlyStage || enemy.rules.some(rule => rule.w[stage])));
  const cards = list.map(enemy => {
    const best = [0, 1, 2].map(index => Math.max(0, ...enemy.rules.map(rule => rule.w[index])));
    const pills = best.map((weight, index) => `<span class="pill${weight ? ' on' : ''}" title="${weight ? 'Best weight ' + fmt(weight) : 'Does not spawn'} in ${DATA.stages[index]}">${STAGE_SHORT[index]}${weight ? ' · ' + fmt(weight) : ''}</span>`).join('');
    const notes = enemy.notes.length ? `<div class="notes">${enemy.notes.map(note => `<p>${esc(note)}</p>`).join('')}</div>` : '';
    const rows = enemy.rules.map(rule => `<tr>
        <td>${condHtml(rule.cond)}</td>
        ${rule.w.map((weight, index) => `<td class="num${weight ? '' : ' zero'}${index === stage ? ' cur' : ''}">${fmt(weight)}${index === stage && weight ? bar(weight) : ''}</td>`).join('')}
        <td>${flags(rule)}</td>
        <td class="num" title="Line in Systems/EnemySpawns.cs">${rule.line}</td>
      </tr>`).join('');
    return `<article class="card" id="enemy-${esc(enemy.name)}">
      <div class="head"><div class="enemy-head"><h3>${esc(enemy.display)}</h3><div class="stagepills">${pills}</div></div><div class="file">${esc(enemy.name)} · ${esc(enemy.file)}</div></div>
      ${notes}
      <div class="tablewrap"><table>
        <thead><tr><th>Condition</th>${STAGE_SHORT.map((label, index) => `<th class="num${index === stage ? ' cur' : ''}">${label}</th>`).join('')}<th>Flags</th><th class="num">Line</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </article>`;
  });

  document.getElementById('view-enemies').innerHTML = `
    <p class="intro">One card per registry enemy, alphabetical. Each row is one line of the registry: when several of an enemy's lines apply at once the <b>highest</b> weight wins, except that a <span class="badge">stop</span> line decides on the spot. A blank stage means the line does not spawn there. The highlighted column is the stage picked above.</p>
    <p style="margin:0 0 14px"><label class="check"><input type="checkbox" id="onlyStage" ${state.onlyStage ? 'checked' : ''}> Only enemies that spawn in ${esc(DATA.stages[stage])}</label> <span class="count">${list.length} shown</span></p>
    ${cards.length ? `<div class="enemies">${cards.join('')}</div>` : '<div class="empty">Nothing matches.</div>'}`;
  document.getElementById('onlyStage').addEventListener('change', event => {
    state.onlyStage = event.target.checked;
    render();
  });
}

function renderZones() {
  const zones = DATA.zones.filter(zone => matches(zone.text + ' ' + zone.notes.join(' ') + ' ' + zone.pool.map(member => member.display + ' ' + member.name).join(' ') + ' ' + zone.biomes.join(' ')));
  const cards = zones.map(zone => {
    const total = zone.pool.reduce((sum, member) => sum + member.weight, 0);
    const pool = zone.pool.length
      ? zone.pool.map(member => `<div class="share"><span class="name">${member.mod ? link(DATA.enemies.find(enemy => enemy.name === member.name) || member) : esc(member.display) + ' <span class="badge gray">vanilla</span>'}</span><div class="bar" title="Share of this zone's spawns"><i style="width:${(member.weight / total * 100).toFixed(1)}%"></i></div><span class="w">${(member.weight / total * 100).toFixed(0)}%</span></div>`).join('')
      : '<div class="share"><span class="name" style="color:var(--muted)">Nothing spawns here.</span></div>';
    return `<div class="card">
      <div class="head">${condHtml(zone.cond)}<div class="file" style="margin-top:6px">Line ${zone.line}${zone.comment ? ' · ' + esc(zone.comment) : ''}</div></div>
      ${zone.notes.length ? `<div class="notes">${zone.notes.map(note => `<p>${esc(note)}</p>`).join('')}</div>` : ''}
      <div class="rows">${pool}</div>
    </div>`;
  });
  document.getElementById('view-zones').innerHTML = `
    <p class="intro">Where one of these conditions holds the whole spawn pool is cleared — vanilla's own pick included — and only the listed enemies spawn, at the shares shown. They run after the invasion block, and a later zone wins where two overlap, so the order here is the order of priority.</p>
    ${cards.length ? `<div class="grid">${cards.join('')}</div>` : '<div class="empty">Nothing matches.</div>'}`;
}

function listCard(title, intro, entries) {
  const shown = entries.filter(entry => matches(entry.display + ' ' + entry.name + ' ' + entry.note));
  const items = shown.map(entry => `<li><b>${esc(entry.display)}</b><span class="file">${esc(entry.file || entry.name)}</span>${entry.note ? `<span class="note">${esc(entry.note)}</span>` : ''}</li>`).join('');
  return `<div class="card" style="margin-bottom:14px"><h2>${esc(title)} <span class="count">${shown.length}</span></h2><p class="notes" style="padding-bottom:4px">${intro}</p>${shown.length ? `<ul class="list">${items}</ul>` : '<div class="empty">None.</div>'}</div>`;
}

function renderLists() {
  document.getElementById('view-lists').innerHTML =
    listCard('Registered with no natural spawn', 'Listed in the registry as a bare comment: tracked, but they only appear through scripts, summons or placement.', DATA.lists.noSpawn) +
    listCard('Spawn by their own SpawnChance', 'Not in the registry on purpose; their spawn rule still lives in their own class.', DATA.lists.ownSpawnChance) +
    listCard('Not in the registry at all', 'Concrete enemies under NPCs/Enemies or NPCs/Puppets the registry never mentions (worm segments skipped). They never spawn naturally — fine for bosses’ minions and scripted enemies; add a bare comment to the registry if one is meant to stay that way.', DATA.lists.unlisted);
}

function renderGlossary() {
  const groups = new Map();
  for (const entry of DATA.glossary) {
    if (!matches(entry.key + ' ' + entry.label + ' ' + entry.doc + ' ' + entry.code)) {
      continue;
    }
    if (!groups.has(entry.group)) {
      groups.set(entry.group, []);
    }
    groups.get(entry.group).push(entry);
  }
  const cards = [...groups].map(([group, entries]) => `<div class="card" style="margin-bottom:14px"><h2>${esc(group === 'Composite' ? 'Shared rule sets' : group)} <span class="count">${entries.length}</span></h2>
    <div class="gloss">${entries.map(entry => {
      const cat = entry.kind === 'composite' ? (entry.group === 'Composite' && ['CatacombWalls', 'GreenDungeonWalls', 'MachineTemple', 'WyvernFortress', 'AdventureWyvernFortress', 'SunkenSkyTemple'].includes(entry.key) ? 'place' : 'composite') : entry.group.toLowerCase();
      return `<div><span class="chip" style="${chipStyle(cat)};cursor:default">${esc(entry.label)}</span><div class="file">${esc(entry.key)}${entry.kind === 'function' ? '(…)' : ''}</div></div>
      <div>${entry.doc ? `<p class="doc">${esc(entry.doc)}</p>` : ''}<code>${esc(entry.code)}</code></div>`;
    }).join('')}</div></div>`);
  document.getElementById('view-glossary').innerHTML = `<p class="intro">Every named test and shared rule set the registry builds conditions from, with the comment above its definition. Shared rule sets are shorthand for a combination of tests.</p>${cards.join('') || '<div class="empty">Nothing matches.</div>'}`;
}

function renderVanilla() {
  const edits = DATA.vanillaEdits.filter(edit => matches(edit.target + ' ' + edit.code + ' ' + edit.conds.join(' ')));
  const rows = edits.map(edit => `<tr>
      <td><span class="badge${edit.op === 'Add' ? '' : ' gray'}">${esc(edit.op)}</span></td>
      <td><b>${esc(edit.target)}</b></td>
      <td class="num">${esc(edit.weight)}</td>
      <td>${edit.conds.map(text => `<div><code>${esc(text)}</code></div>`).join('') || '<span class="count">always</span>'}</td>
      <td class="num">${edit.line}</td>
    </tr>`).join('');
  document.getElementById('view-vanilla').innerHTML = `<p class="intro">Vanilla enemies stay out of the registry. These are the pool edits in <code>tsorcRevampGlobalNPC.EditSpawnPool</code> (NPCs/GlobalNPC.cs), with the if-conditions around each one. The registry is applied before them, its exclusive zones after them.</p>
    <div class="card"><div class="tablewrap"><table><thead><tr><th>Op</th><th>NPC</th><th class="num">Weight</th><th>Conditions</th><th class="num">Line</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

function render() {
  for (const [id] of TABS) {
    document.getElementById('view-' + id).hidden = id !== state.tab;
  }
  for (const button of document.querySelectorAll('#tabs button')) {
    button.setAttribute('aria-selected', String(button.dataset.tab === state.tab));
  }
  for (const button of document.querySelectorAll('#stages button')) {
    button.setAttribute('aria-pressed', String(Number(button.dataset.stage) === state.stage));
  }
  document.getElementById('stages').style.visibility = state.tab === 'biomes' || state.tab === 'enemies' ? 'visible' : 'hidden';
  ({ biomes: renderBiomes, enemies: renderEnemies, zones: renderZones, lists: renderLists, glossary: renderGlossary, vanilla: renderVanilla })[state.tab]();
}

function openEnemy(name) {
  state.tab = 'enemies';
  state.query = '';
  document.getElementById('search').value = '';
  render();
  const card = document.getElementById('enemy-' + name);
  if (card) {
    // Instant, after the next frame: a smooth scroll started during load is cancelled by the browser's scroll restore.
    requestAnimationFrame(() => card.scrollIntoView({ block: 'start' }));
    card.classList.add('flash');
  }
}

function setup() {
  const ruleCount = DATA.enemies.reduce((sum, enemy) => sum + enemy.rules.length, 0);
  document.getElementById('summary').innerHTML = `${DATA.enemies.length} enemies · ${ruleCount} spawn lines · ${DATA.zones.length} exclusive zones · from <code>${esc(DATA.source)}</code>`;
  document.getElementById('tabs').innerHTML = TABS.map(([id, label]) => `<button role="tab" data-tab="${id}">${label}</button>`).join('');
  document.getElementById('stages').innerHTML = DATA.stages.map((label, index) => `<button data-stage="${index}">${label}</button>`).join('');

  document.getElementById('tabs').addEventListener('click', event => {
    const button = event.target.closest('button');
    if (button) {
      state.tab = button.dataset.tab;
      render();
      scrollTo({ top: 0 });
    }
  });
  document.getElementById('stages').addEventListener('click', event => {
    const button = event.target.closest('button');
    if (button) {
      state.stage = Number(button.dataset.stage);
      render();
    }
  });
  document.getElementById('search').addEventListener('input', event => {
    state.query = event.target.value.trim().toLowerCase();
    render();
  });
  document.querySelector('main').addEventListener('click', event => {
    const anchor = event.target.closest('a[data-enemy]');
    if (anchor) {
      event.preventDefault();
      openEnemy(anchor.dataset.enemy);
    }
  });

  // Theme toggle: remembered per browser when storage works; the page follows the system setting otherwise.
  const root = document.documentElement;
  try {
    const saved = localStorage.getItem('enemy-spawns-theme');
    if (saved) {
      root.dataset.theme = saved;
    }
  } catch (error) {
  }
  document.getElementById('theme').addEventListener('click', () => {
    const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
    try {
      localStorage.setItem('enemy-spawns-theme', root.dataset.theme);
    } catch (error) {
    }
  });

  // #enemy-Name links (shareable, and from other DevData pages) open that enemy's card, on load or when the hash changes.
  const openFromHash = () => {
    if (location.hash.startsWith('#enemy-')) {
      openEnemy(decodeURIComponent(location.hash.slice(7)));
    }
  };
  addEventListener('hashchange', openFromHash);

  render();
  openFromHash();
}

setup();
</script>
</body>
</html>
